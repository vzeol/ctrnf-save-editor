name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v1.0.0
        required: true
        type: string
permissions:
  contents: read
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Validate version
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(\d+\.\d+\.\d+(?:-[A-Za-z0-9.-]+)?)$') { throw 'Invalid release tag' }
          $version = $Matches[1]
          [xml]$props = Get-Content Directory.Build.props
          if ($props.Project.PropertyGroup.Version -ne $version) { throw 'Tag and source version differ' }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Build and test
        shell: pwsh
        run: |
          ./scripts/build.ps1
          ./scripts/test.ps1
      - name: Package
        shell: pwsh
        run: ./scripts/publish.ps1 -Version $env:RELEASE_VERSION
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(Get-ChildItem artifacts/releases -File | ForEach-Object FullName)
          $arguments = @('release', 'create', $env:RELEASE_TAG, '--verify-tag', '--title', "Save Editor $env:RELEASE_VERSION", '--notes-file', '.github/release-notes.md')
          if ($env:RELEASE_VERSION.Contains('-')) { $arguments += '--prerelease' }
          & gh @arguments @files
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
